<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Insurance Fraud Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Medical Insurance Fraud Detection</h2>

        <!--form action="{{ url_for('result') }}" method="POST" class="p-4 bg-white shadow-sm rounded"-->
        <form action="/result" method="POST" class="p-4 bg-white shadow-sm rounded">

            <!--성별 선택-->
            <div class="mb-3">
              <select name="gender" class="form-control" required>
                    <option value="" disabled selected>Gender Selection</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <!--나이 선택 18~100 중에서 선택-->
            <div class="mb-3">
                <input type="number" name="age" class="form-control" placeholder="Age (18-100)" min="18" max="100" required>
            </div>

            <!--사고 원인 체크-->
            <div class="mb-3">
                <select name="cause" class="form-control" required>
                    <option value="" disabled selected>Select the cause of the accident</option>
                    <option value="Road Traffic Accident">a traffic accident</option>
                    <option value="Accident At Work">an accident on the job</option>
                    <option value="Accident At Home">a domestic accident</option>
                    <option value="Other">other</option>
                </select>
            </div>

            <!--부과되는 수수료 -->
            <div class="mb-3">
                <input type="number" name="fee_charged" class="form-control" placeholder="Billed amount (500-50000)" min="500" max="50000" required>
            </div>

            <!--멤버십 기간-->
            <div class="mb-3">
                <input type="number" name="membership_period" class="form-control" placeholder="Membership Period (1-10year)" min="1" max="10" required>
            </div>

            <!--청구 수-->
            <div class="mb-3">
                <input type="number" name="number_of_claims" class="form-control" placeholder="Number of claims (1-10)" min="1" max="10" required>
            </div>

            <!--부양가족 수-->
            <div class="mb-3">
                <input type="number" name="number_of_dependants" class="form-control" placeholder="Number of dependents (0-5)" min="0" max="5" required>
            </div>

            <!--완료 버튼-->
            <button type="submit" class="btn btn-primary w-100">Detection</button>

        </form>
    </div>

</body>
</html>
